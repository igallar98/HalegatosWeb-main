hero:
  eyebrow: Alianzas
  title: Remamos juntos
  lead: Colaboraciones que conectan deporte, inclusión, visibilidad y comunidad en un proyecto con identidad propia.
  image: /static/images/CABECERA-08.png
  alt: Imagen de ambiente deportivo para la sección de alianzas.
  chips:
    - Patrocinadores
    - Colaboradores
    - Patrocinadores de eventos

intro:
  eyebrow: Por qué colaborar
  title: Un club con presencia, valores claros y una comunidad muy viva.
  text: Halegatos ofrece una plataforma honesta para colaborar con un proyecto que une deporte, inclusión y visibilidad. Nos interesa construir relaciones útiles para ambas partes, con sentido y continuidad.
  points:
    - Visibilidad vinculada a deporte inclusivo y comunidad activa.
    - Acciones conjuntas en eventos, equipaciones o actividades del club.
    - Colaboraciones adaptadas al tipo de marca o institución.

scholarships:
  eyebrow: Becas e integración
  title: El deporte también puede ser una puerta de entrada
  text: Halegatos trabaja con ONGs y entidades sociales para facilitar, cuando es posible, el acceso al club de personas refugiadas o solicitantes de asilo. Buscamos que el deporte también sea un espacio de acompañamiento, pertenencia e integración.
  points:
    - Colaboraciones con impacto social real dentro y fuera del agua.
    - Itinerarios de acompañamiento adaptados a cada situación.
    - Una forma concreta de apoyar inclusión, salud y comunidad.

